# Project-scoped MCP configuration, mirroring the repo's .mcp.json.
#
# Codex loads this as the "project" config layer, which sits above the user
# layer in ~/.codex/config.toml; it only applies while this directory is
# trusted (see [projects."d:\\halflife-cli"] in the user config).

[mcp_servers.halflife]
type = "stdio"
command = "uv"
args = ["run", "--script", "mcp/halflife_mcp.py"]
# Codex spawns a stdio server with the session's cwd, whereas Claude Code
# uses the project root. Pin the cwd so the repo-relative script path above
# resolves no matter where codex is started from.
cwd = "D:/halflife-cli"
# First launch may have to resolve mcp/pillow/pywin32 through uv.
startup_timeout_sec = 120
