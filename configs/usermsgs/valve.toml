# Half-Life (mod dir: valve) UserMsg wire formats.
#
# Transcribed from .zcode/networkmessages/hl-10210/usermessages.md
# (hl-10210 client.so, reverse engineered; every field order verified by
# decompilation). Numeric message ids are assigned per server via
# svc_newusermsg, so everything here is name-driven.
#
# Schema syntax:
#   [primitives] coord_size = 2|4     bytes of "coord" (2: short/8, 4: long/8)
#   extends = "other.toml"            inherit a base file (child overrides by name)
#   [[usermsg]]                       one message: name, note, raw, fields
#   fields: name/type/count/when/fields/note
#     type   byte|char|short|word|long|float|coord|angle|angle16|string|vec3|group
#     count  N | "<field name>" | "*"   (repeat; * = until the buffer runs out)
#     when   { field = "...", eq|ne = N }  (read this field only when the
#             previously-read field matches)

[primitives]
coord_size = 2    # READ_COORD = short * 1/8 on the byte-aligned usermsg stream

[[usermsg]]
name = "AmmoX"
fields = [
	{ name = "index", type = "byte" },
	{ name = "count", type = "byte" },
]

[[usermsg]]
name = "AmmoPickup"
