# Half-Life (mod dir: valve) UserMsg wire formats.
#
# Transcribed from reverse-engineered hl-10210 client.so sources; every
# field order verified by decompilation. Numeric message ids are assigned per server via
# svc_newusermsg, so everything here is name-driven. Cross-checked against the
# GoldSrc-SDK sources: cl_dll/*.cpp (client hook read order) and dlls/*.cpp
# (server MESSAGE_BEGIN/WRITE_* order, which is authoritative for the wire).
#
# Schema syntax:
#   [primitives] coord_size = 2|4     bytes of "coord" (2: short/8, 4: long/8)
#   extends = "other.toml"            inherit a base file (child overrides by name)
#   [[usermsg]]                       one message: name, channel, note, raw, fields
#   channel                           functional group for the plugin's event ring
#                                     and [usermsg] display_channels (weapon,
#                                     status, text, score, screen, world, hud,
#                                     meta; default "usermsg"; "all" is reserved
#                                     as the query/display wildcard). An override
#                                     that omits channel inherits the base's.
#   fields: name/type/count/when/fields/note
#     type   byte|char|short|word|long|float|coord|angle|angle16|string|vec3|group
#     count  N | "<field name>" | "*"   (repeat; * = until the buffer runs out)
#     when   { field = "...", eq|ne = N }  (read this field only when the
#             previously-read field matches)

[primitives]
coord_size = 2    # READ_COORD = short * 1/8 on the byte-aligned usermsg stream

[[usermsg]]
name = "AmmoX"
channel = "weapon"
fields = [
	{ name = "index", type = "byte" },
	{ name = "count", type = "byte" },
]

[[usermsg]]
name = "AmmoPickup"
channel = "weapon"
fields = [
	{ name = "index", type = "byte" },
	{ name = "count", type = "byte" },
]

[[usermsg]]
name = "WeapPickup"
channel = "weapon"
fields = [
	{ name = "index", type = "byte" },
]

[[usermsg]]
name = "ItemPickup"
channel = "weapon"
fields = [
	{ name = "itemName", type = "string" },
]

[[usermsg]]
name = "HideWeapon"
channel = "weapon"
fields = [
	{ name = "hideBits", type = "byte" },
]

[[usermsg]]
name = "CurWeapon"
channel = "weapon"
fields = [
	{ name = "state", type = "byte", note = "0=holster 1=active 2=active+autofire" },
	{ name = "weaponId", type = "char" },
	{ name = "clip", type = "char", note = "-1=no magazine" },
]

[[usermsg]]
name = "WeaponList"
channel = "weapon"
fields = [
	{ name = "name", type = "string" },
	{ name = "ammo1Type", type = "char", note = "-1=none" },
	{ name = "ammo1Max", type = "byte", note = "255=-1" },
	{ name = "ammo2Type", type = "char" },
	{ name = "ammo2Max", type = "byte", note = "255=-1" },
	{ name = "slot", type = "char", note = "weapon bucket (WEAPON.iSlot)" },
	{ name = "slotPosition", type = "char", note = "position in bucket (iSlotPos)" },
	{ name = "weaponId", type = "char", note = "weapon index (iId)" },
	{ name = "flags", type = "byte" },
]

[[usermsg]]
name = "SecAmmoVal"
channel = "weapon"
fields = [
	{ name = "slot", type = "byte", note = "<4" },
	{ name = "amount", type = "byte" },
]

[[usermsg]]
name = "SecAmmoIcon"
channel = "weapon"
fields = [
	{ name = "spriteName", type = "string" },
]

[[usermsg]]
name = "SetFOV"
channel = "weapon"
fields = [
	{ name = "fov", type = "byte", note = "0=default_fov" },
]

[[usermsg]]
name = "Geiger"
channel = "status"
fields = [
	{ name = "range", type = "byte", note = "*4 when used" },
]

[[usermsg]]
name = "FlashBat"
channel = "status"
fields = [
	{ name = "battery", type = "byte", note = "/100" },
]

[[usermsg]]
name = "Flashlight"
channel = "status"
fields = [
	{ name = "on", type = "byte" },
	{ name = "battery", type = "byte", note = "/100" },
]

[[usermsg]]
name = "Battery"
channel = "status"
fields = [
	{ name = "armor", type = "short" },
]

[[usermsg]]
name = "Health"
channel = "status"
fields = [
	{ name = "health", type = "byte" },
]

[[usermsg]]
name = "Damage"
channel = "status"
note = "damage direction indicator"
fields = [
	{ name = "armor", type = "byte" },
	{ name = "damageTaken", type = "byte" },
	{ name = "bitsDamage", type = "long", note = "DMG_* flags" },
	{ name = "vecFrom", type = "vec3" },
]

[[usermsg]]
name = "DeathMsg"
channel = "score"
fields = [
	{ name = "killer", type = "byte" },
	{ name = "victim", type = "byte" },
	{ name = "weapon", type = "string", note = "e.g. d_xx" },
]

[[usermsg]]
name = "SayText"
channel = "text"
fields = [
	{ name = "client", type = "byte" },
	{ name = "text", type = "string" },
]

[[usermsg]]
name = "TextMsg"
channel = "text"
note = "MsgFunc_TextMsg: one localised format string plus up to four %s arguments"
fields = [
	{ name = "dest", type = "byte", note = "1|2=console 3=chat 4=center" },
	{ name = "format", type = "string", note = "localised text containing %s" },
	{ name = "param1", type = "string" },
	{ name = "param2", type = "string" },
	{ name = "param3", type = "string" },
	{ name = "param4", type = "string" },
]

[[usermsg]]
name = "HudText"
channel = "text"
fields = [
	{ name = "messageName", type = "string" },
]

[[usermsg]]
name = "GameTitle"
channel = "text"
note = "server sends one unused byte; MsgFunc_GameTitle reads no fields"
fields = [
	{ name = "unused", type = "byte" },
]

[[usermsg]]
name = "Logo"
channel = "hud"
note = "spray-logo state; the server registers Logo on demand (REG_USER_MSG(\"Logo\", 1)) and sends one byte, the client stores it in CHud::m_iLogo"
fields = [
	{ name = "on", type = "byte" },
]

[[usermsg]]
name = "Train"
channel = "hud"
fields = [
	{ name = "pos", type = "byte", note = "0=hide" },
]

[[usermsg]]
name = "StatusIcon"
channel = "status"
fields = [
	{ name = "enable", type = "byte" },
	{ name = "icon", type = "string" },
	{ name = "rgb", type = "byte", count = 3, when = { field = "enable", ne = 0 } },
]

[[usermsg]]
name = "StatusText"
channel = "status"
fields = [
	{ name = "line", type = "byte", note = "<4" },
	{ name = "text", type = "string" },
]

[[usermsg]]
name = "StatusValue"
channel = "status"
fields = [
	{ name = "index", type = "byte", note = "1..8" },
	{ name = "value", type = "short" },
]

[[usermsg]]
name = "ShowMenu"
channel = "hud"
note = "the text string is always on the wire (even for the slots==0 close message, where it is empty); MsgFunc_ShowMenu itself only reads it when validSlots != 0"
fields = [
	{ name = "validSlots", type = "short" },
	{ name = "displayTime", type = "char", note = "0=forever" },
	{ name = "isMore", type = "byte" },
	{ name = "text", type = "string" },
]

[[usermsg]]
name = "MOTD"
channel = "text"
fields = [
	{ name = "isLast", type = "byte" },
	{ name = "chunk", type = "string" },
]

[[usermsg]]
name = "ServerName"
channel = "score"
fields = [
	{ name = "name", type = "string" },
]

[[usermsg]]
name = "ScoreInfo"
channel = "score"
fields = [
	{ name = "playerIndex", type = "byte" },
	{ name = "frags", type = "short" },
	{ name = "deaths", type = "short" },
	{ name = "playerClass", type = "short" },
	{ name = "teamNumber", type = "short" },
]

[[usermsg]]
name = "TeamInfo"
channel = "score"
fields = [
	{ name = "playerIndex", type = "byte", note = "1..64" },
	{ name = "teamName", type = "string" },
]

[[usermsg]]
name = "TeamNames"
channel = "score"
fields = [
	{ name = "numTeams", type = "byte" },
	{ name = "teamName", type = "string", count = "numTeams" },
]

[[usermsg]]
name = "TeamScore"
channel = "score"
fields = [
	{ name = "teamName", type = "string" },
	{ name = "frags", type = "short" },
	{ name = "deaths", type = "short" },
]

[[usermsg]]
name = "Spectator"
channel = "score"
fields = [
	{ name = "playerIndex", type = "byte", note = "1..64" },
	{ name = "isSpectator", type = "byte" },
]

[[usermsg]]
name = "AllowSpec"
channel = "score"
fields = [
	{ name = "allow", type = "byte" },
]

[[usermsg]]
name = "ValClass"
channel = "score"
note = "MsgFunc_ValClass reads exactly five shorts (valid classes)"
fields = [
	{ name = "classes", type = "short", count = 5 },
]

[[usermsg]]
name = "Feign"
channel = "status"
fields = [
	{ name = "state", type = "byte" },
]

[[usermsg]]
name = "Detpack"
channel = "weapon"
fields = [
	{ name = "state", type = "byte" },
]

[[usermsg]]
name = "BuildSt"
channel = "weapon"
fields = [
	{ name = "state", type = "short" },
]

[[usermsg]]
name = "RandomPC"
channel = "score"
fields = [
	{ name = "state", type = "byte" },
]

[[usermsg]]
name = "VGUIMenu"
channel = "hud"
fields = [
	{ name = "menuID", type = "byte" },
	{ name = "mapName", type = "string", when = { field = "menuID", eq = 4 } },
]

[[usermsg]]
name = "InitHUD"
channel = "hud"
fields = []

[[usermsg]]
name = "ResetHUD"
channel = "hud"
note = "player.cpp writes one zero byte; MsgFunc_ResetHUD ignores the payload (cstrike overrides this with zero fields)"
fields = [
	{ name = "unused", type = "byte" },
]

[[usermsg]]
name = "GameMode"
channel = "meta"
fields = [
	{ name = "teamplay", type = "byte" },
]

[[usermsg]]
name = "ViewMode"
channel = "screen"
fields = []

[[usermsg]]
name = "Concuss"
channel = "status"
fields = [
	{ name = "state", type = "byte" },
]

[[usermsg]]
name = "ResetFade"
channel = "screen"
fields = []

[[usermsg]]
name = "SpecFade"
channel = "screen"
fields = []

# ------------------------------------------- engine-handled (HookServerMsg)
# The engine registers these two itself (cdll_int.cpp: HookServerMsg) and
# V_ScreenShake/V_ScreenFade read them; the layouts are fixed.

[[usermsg]]
name = "ScreenShake"
channel = "screen"
note = "engine-handled (V_ScreenShake)"
fields = [
	{ name = "amplitude", type = "short" },
	{ name = "duration", type = "short" },
	{ name = "frequency", type = "short" },
]

[[usermsg]]
name = "ScreenFade"
channel = "screen"
note = "engine-handled (V_ScreenFade)"
fields = [
	{ name = "duration", type = "short" },
	{ name = "holdTime", type = "short" },
	{ name = "flags", type = "short" },
	{ name = "r", type = "byte" },
	{ name = "g", type = "byte" },
	{ name = "b", type = "byte" },
	{ name = "a", type = "byte" },
]

[[usermsg]]
name = "VoiceMask"
channel = "meta"
note = "voice_gamemgr writes VOICE_MAX_PLAYERS_DW(1) dword pair = 8 bytes; the client also tries to read a trailing serverModEnable byte, which is not on the wire"
fields = [
	{ name = "audiblePlayers", type = "long" },
	{ name = "bannedPlayers", type = "long" },
]

[[usermsg]]
name = "ReqState"
channel = "meta"
note = "HLTV spectating state request"
fields = []

# ---------------------------------------- registered, no client hook (raw)
# Every HL-family server registers SelAmmo, but none of the SDK sources write
# it and the client never hooks it, so its four bytes stay opaque.

[[usermsg]]
name = "SelAmmo"
channel = "weapon"
note = "raw: registered (4 bytes), never sent or hooked in the SDK"
raw = true
fields = []
