[[usermsg]]
name = "PrtlUpdt"
channel = "world"
note = "CPortal::UpdateClient / MsgFunc_PrtlUpdt: flat state, then mode-gated source, monitor size and portal plane flags; textureMode 2 appends the texture name"
fields = [
	{ name = "entityIndex", type = "long" },
	{ name = "active", type = "byte" },
	{ name = "state", type = "group", when = { field = "active", ne = 0 }, fields = [
		{ name = "origin", type = "vec3", note = "long*1/8" },
		{ name = "angles", type = "vec3", note = "long*1/8" },
		{ name = "mode", type = "byte", note = "0=mirror 1=monitor 2=portal" },
		{ name = "textureMode", type = "byte", note = "0=transparent 1=all 2=named" },
		{ name = "zoom", type = "float" },
		{ name = "fps", type = "byte" },
		{ name = "minDistance", type = "long" },
		{ name = "maxDistance", type = "long" },
		{ name = "halfFrame", type = "byte" },
		{ name = "hasSource", type = "byte", when = { field = "mode", ne = 0 } },
		{ name = "source", type = "group", when = { field = "hasSource", eq = 1 }, fields = [
			{ name = "entityIndex", type = "long" },
			{ name = "origin", type = "vec3" },
			{ name = "angles", type = "angle", count = 3, note = "byte*360/256" },
		] },
		{ name = "hasCustomSize", type = "byte", when = { field = "mode", eq = 1 } },
		{ name = "size", type = "group", when = { field = "hasCustomSize", eq = 1 }, fields = [
			{ name = "width", type = "long" },
			{ name = "height", type = "long" },
		] },
		{ name = "noPlanes", type = "byte", when = { field = "mode", eq = 2 } },
		{ name = "shootThrough", type = "byte", when = { field = "mode", eq = 2 } },
		{ name = "textureName", type = "string", when = { field = "textureMode", eq = 2 } },
	] },
]

