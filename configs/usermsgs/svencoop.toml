# Sven Co-op (mod dir: svencoop) UserMsg wire formats, build 10257.
#
# Transcribed from .zcode/networkmessages/svencoop-10257/usermessages.md
# (server.so 87 registrations + client.so 86 hooks, reverse engineered with
# path-sensitive CFG verification).
#
# Only messages whose wire format differs from Half-Life, plus Sven-specific
# messages, are defined here; everything else is inherited from valve.toml.
# The engine-dialect change that matters most: usermsg READ_COORD is a
# 32-bit long * 1/8 (not the 16-bit short * 1/8 of hl/cstrike), which also
# makes the inherited Damage definition (byte byte long vec3) correct.

extends = "valve.toml"

[primitives]
coord_size = 4    # READ_COORD = long * 1/8 (svencoop usermsg-layer convention)

# ------------------------------------------------------------- wire differs

[[usermsg]]
name = "CurWeapon"
note = "10257: weapon id and clip widened"
fields = [
	{ name = "state", type = "byte" },
	{ name = "weaponId", type = "short" },
	{ name = "clip", type = "long", note = "-1=no magazine" },
	{ name = "aux", type = "long", note = "unknown 4-byte tail" },
]

[[usermsg]]
name = "Health"
fields = [
	{ name = "health", type = "long" },
]

[[usermsg]]
name = "WeaponList"
note = "ammo types/max widened to long, slot to short"
fields = [
	{ name = "name", type = "string" },
	{ name = "ammo1Type", type = "char", note = "-1=none" },
	{ name = "ammo1Max", type = "long" },
	{ name = "ammo2Type", type = "char" },
	{ name = "ammo2Max", type = "long" },
	{ name = "bucket", type = "char" },
	{ name = "bucketPosition", type = "char" },
	{ name = "slot", type = "short" },
	{ name = "flags", type = "byte" },
]

[[usermsg]]
