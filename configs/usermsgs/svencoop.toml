# Sven Co-op (mod dir: svencoop) UserMsg wire formats, build 10257.
#
# Transcribed from reverse-engineered svencoop 10257 sources (server.so 87
# registrations + client.so 86 hooks), with path-sensitive CFG verification,
# and cross-checked against svencoop_sdk: the wire order and gating come from
# the server's MESSAGE_BEGIN/WRITE_* code (dlls/, game_shared/) and the field
# order from the client hook's READ_* code (cl_dll/).
#
# Only messages whose wire format differs from Half-Life, plus Sven-specific
# messages, are defined here; everything else is inherited from valve.toml.
# The engine-dialect change that matters most: usermsg READ_COORD is a
# 32-bit long * 1/8 (not the 16-bit short * 1/8 of hl/cstrike), which also
# makes the inherited Damage definition (byte byte long vec3) correct.

extends = "valve.toml"

[primitives]
coord_size = 4    # READ_COORD = long * 1/8 (svencoop usermsg-layer convention)

# ------------------------------------------------------------- wire differs

[[usermsg]]
name = "CurWeapon"
channel = "weapon"
note = "10257: weapon id widened to short and both clip values to long"
fields = [
	{ name = "state", type = "byte", note = "WEAPON_STATE_* bits" },
	{ name = "weaponId", type = "short" },
	{ name = "clip", type = "long", note = "-1=no magazine" },
	{ name = "clip2", type = "long", note = "secondary clip (iClip2)" },
]

[[usermsg]]
name = "Health"
