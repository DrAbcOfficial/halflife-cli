	{ name = "kind", type = "byte" },
	{ name = "page", type = "group", when = { field = "kind", eq = 1 }, fields = [
		{ name = "current", type = "short" },
		{ name = "total", type = "short" },
		{ name = "mapName", type = "string", count = "*" },
	] },
	{ name = "announce", type = "group", when = { field = "kind", eq = 0 }, fields = [
		{ name = "total", type = "short" },
		{ name = "mapName", type = "string", count = "*" },
