[[usermsg]]
name = "Gib"
channel = "world"
note = "EV_Message_Gib: type then origin and velocity coords; every type the server sends reads both vectors"
fields = [
	{ name = "type", type = "byte", note = "0=human 1=human_random 2=alien_random 4=sticky" },
	{ name = "origin", type = "vec3" },
	{ name = "velocity", type = "vec3" },
]

[[usermsg]]
name = "DeathMsg"
channel = "score"
note = "MsgFunc_DeathMsg reads killer, victim and the weapon/inflictor name (teamplay_gamerules sends byte byte string)"
fields = [
	{ name = "killer", type = "byte" },
	{ name = "victim", type = "byte" },
	{ name = "weapon", type = "string" },
]

