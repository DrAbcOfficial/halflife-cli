name: LiveBuild

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

# Superseded runs of the same branch or PR are cancelled; the first run on a
# ref is never cancelled.
concurrency:
  group: livebuild-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
