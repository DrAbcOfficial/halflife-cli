name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # needed by softprops/action-gh-release

jobs:
  build:
    uses: ./.github/workflows/build.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download packaged archive
        uses: actions/download-artifact@v8.0.2
        with:
          # upload-artifact with archive:false names the artifact after the
          # file, extension included.
          name: HalflifeCLI-windows-x86.7z

      - name: Hash the archive
        run: sha256sum HalflifeCLI-windows-x86.7z > HalflifeCLI-windows-x86.7z.sha256

      - name: Publish release
        uses: softprops/action-gh-release@v3.0.3
        with:
          name: HalflifeCLI-${{ github.ref_name }}
          files: |
            HalflifeCLI-windows-x86.7z
            HalflifeCLI-windows-x86.7z.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
