# Reusable build shared by LiveBuild (push/PR) and Release (v* tags).
# Configure, build, install, test (C++ and Python), validate the shipped
# config types, and package the game-dir layout as a 7z artifact.
name: Plugin build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build-win32:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # Only tomlplusplus remains a submodule. CMake fetches pinned MetaHook and
      # VGUI2Extension sources without their recursive submodules.
      - name: Init submodules (shallow, top-level only)
        run: git submodule update --init --depth 1

      # No explicit generator: cmake picks the newest Visual Studio installed
      # on the runner, keeping this working across runner image updates.
      - name: Configure (Win32 — the game process is 32-bit)
        run: cmake -S . -B build -A Win32

      - name: Build and install
        run: |
          cmake --build build --config Release
          cmake --install build --config Release --prefix install/x86/Release

      - name: Run C++ tests
        run: ctest --test-dir build -C Release --output-on-failure

      # tomllib needs Python 3.11+; do not trust whatever Python the runner
      # image happens to put on PATH — pin the interpreter.
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'

      # Same dependencies the MCP server declares inline. Cases needing an
      # installed game skip themselves (the runner has no Steam, no game).
      - name: Run Python tooling tests
        working-directory: mcp
        run: |
          python -m pip install --quiet "mcp>=2.2,<3" pywin32 pillow
          python -m unittest discover -s tests -v

      # The install rule's typed TOML booleans must survive the file being read
      # back through the plugin's parser; a type error would silently fall back
      # to the compiled-in default. Assert the shapes we rely on.
      - name: Validate shipped config
        shell: python
        run: |
          import tomllib
          with open("install/x86/Release/svencoop/metahook/configs/halflifecli/halflifecli.toml", "rb") as f:
              cfg = tomllib.load(f)
          assert isinstance(cfg["cli"]["developer"], int), "developer must be an integer"
          assert isinstance(cfg["cli"]["hide_window"], int), "hide_window must be an integer"
          for key in ("capture", "console", "block_input", "input_lock", "console_topmost", "rcon"):
              assert isinstance(cfg["cli"][key], bool), "cli.%s must be a boolean" % key
          assert isinstance(cfg["usermsg"]["enabled"], bool)
          assert isinstance(cfg["usermsg"]["max_string"], int)
          assert isinstance(cfg["rcon"]["password"], str)
          print("halflifecli.toml parsed with the expected key types")

      # Package the whole game-dir layout the install rules produced, plus the
      # MCP tooling and a kit README. Extracting into a Sven Co-op root
      # installs the plugin, config and gamedata; mcp\ can live anywhere.
      - name: Package release 7z
        id: package
        shell: pwsh
        working-directory: install/x86/Release
        run: |
          # Runtime modules only: what halflife_mcp.py imports, nothing test-only.
          $mcpSource = Join-Path $env:GITHUB_WORKSPACE 'mcp'
          $mcpDest = Join-Path $PWD 'mcp'
          New-Item -ItemType Directory -Path (Join-Path $mcpDest 'halflifecli') -Force | Out-Null
          foreach ($name in @('halflife_mcp.py', 'game_process.py', 'rcon_client.py', 'find_game.py')) {
            Copy-Item -LiteralPath (Join-Path $mcpSource $name) -Destination $mcpDest
          }
          Copy-Item -Path (Join-Path $mcpSource 'halflifecli\*.py') -Destination (Join-Path $mcpDest 'halflifecli')
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'scripts\release-kit-readme.txt') -Destination (Join-Path $PWD 'README.txt')

          $archiveDirectory = Join-Path $env:GITHUB_WORKSPACE 'build/artifacts'
          New-Item -ItemType Directory -Path $archiveDirectory -Force | Out-Null
          $archivePath = Join-Path $archiveDirectory 'HalflifeCLI-windows-x86.7z'
          if (Test-Path -LiteralPath $archivePath -PathType Leaf) {
            Remove-Item -LiteralPath $archivePath
          }
          & 7z a -t7z $archivePath 'svencoop' 'mcp' 'README.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & 7z t $archivePath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "archive-path=$archivePath" >> $env:GITHUB_OUTPUT

      - name: Upload build artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: HalflifeCLI-windows-x86
          path: ${{ steps.package.outputs.archive-path }}
          if-no-files-found: error
          archive: false
