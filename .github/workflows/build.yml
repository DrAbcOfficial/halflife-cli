name: build

on:
  push: # every push (any branch) builds; v* tag pushes additionally release
  workflow_dispatch:

permissions:
  contents: write # needed by softprops/action-gh-release on tag builds

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # Only tomlplusplus remains a submodule. CMake fetches pinned MetaHook and
      # VGUI2Extension sources without their recursive submodules.
      - name: Init submodules (shallow, top-level only)
        run: git submodule update --init --depth 1

      # No explicit generator: cmake picks the newest Visual Studio installed
      # on the runner, keeping this working across runner image updates.
      - name: Configure (Win32 — the game process is 32-bit)
        run: cmake -S . -B build -A Win32

      - name: Build
        run: cmake --build build --config Release

      - name: Upload build artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: HalflifeCLI-dll
          path: build/Release/HalflifeCLI.dll
          if-no-files-found: error

      - name: Package release zip
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          # Game-dir layout: extracting the zip into "svencoop/" installs the
          # plugin DLL and the usermsg schemas in one step.
          $stage = "stage/metahook"
          New-Item -ItemType Directory -Force -Path "$stage/plugins", "$stage/configs/halflifecli/usermsgs" | Out-Null
          Copy-Item build/Release/HalflifeCLI.dll "$stage/plugins/"
          Copy-Item configs/usermsgs/*.toml "$stage/configs/halflifecli/usermsgs/"
          Compress-Archive -Path stage/metahook -DestinationPath "HalflifeCLI-${{ github.ref_name }}.zip"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: HalflifeCLI-*.zip
